<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%">
  <defs>
    <!-- Multi-stop neon gradient -->
    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="20%" stop-color="#aa00ff" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#00ff66" />
      <stop offset="80%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    
    <!-- Neon glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Stylized border lines above and below -->
  <line x1="10" y1="5" x2="790" y2="5" stroke="url(#sigGrad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="10 12" />
  <line x1="10" y1="55" x2="790" y2="55" stroke="url(#sigGrad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="10 12" />

  <!-- The signature text with glow -->
  <text x="50%" y="37" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="24" 
        fill="url(#sigGrad)" 
        text-anchor="middle" 
        letter-spacing="12" 
        filter="url(#neonGlow)">
    XOXOXOXOXOXOXOXOXOXO
  </text>
</svg>
